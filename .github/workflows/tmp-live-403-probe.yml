# TEMPORARY diagnostic (removed in the next commit): read-only GET requests against the
# live lab folder to find out why fixtures-phase9/manifest.json returns HTTP 403.
name: tmp-live-403-probe
on:
  push:
    paths: ['.github/workflows/tmp-live-403-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          B=https://app.noblepdf.com/lab/true-text-edit
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36'
          p() { # label url
            code=$(curl -sS -o /tmp/body -D /tmp/hdr -w '%{http_code}' -m 20 -A "$UA" -H 'Accept: */*' -H "Referer: $B/phase9-suite.html" -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Dest: empty' "$1" || echo ERR)
            len=$(wc -c < /tmp/body)
            ct=$(grep -i '^content-type:' /tmp/hdr | tr -d '\r' | head -1)
            srv=$(grep -iE '^(server|x-powered-by|x-.*):' /tmp/hdr | tr -d '\r' | tr '\n' ' ' | cut -c1-200)
            sha=$(sha256sum /tmp/body | cut -c1-16)
            echo "$code len=$len sha=$sha $ct | $srv | $1"
            if [ "$code" = 403 ]; then echo "  403 body: $(tr -s ' \n\r\t' ' ' < /tmp/body | cut -c1-400)"; fi
          }
          echo "== deployed files"
          p "$B/fixtures-phase9/manifest.json?v=1"
          p "$B/fixtures-phase9/manifest.json"
          p "$B/fixtures-phase9/one-glyph-object-before.pdf?v=1"
          p "$B/fixtures-phase8/pure-tj-before.pdf?v=1"
          p "$B/te-data.mjs?v=1"
          p "$B/phase9-suite.js?v=1"
          echo "== nonexistent names (404 = filesystem reached; 403 = rule on the name before the filesystem)"
          p "$B/fixtures-phase9/does-not-exist.json"
          p "$B/fixtures-phase9/does-not-exist.pdf"
          p "$B/fixtures-phase9/does-not-exist.txt"
          p "$B/fixtures-phase9/does-not-exist.bin"
          p "$B/fixtures-phase9/manifest.txt"
          p "$B/fixtures-phase9/manifest"
          p "$B/does-not-exist.json"
          p "$B/manifest.json"
          p "https://app.noblepdf.com/does-not-exist.json"
          echo "== plain curl (no browser headers)"
          curl -sS -o /dev/null -w '%{http_code} plain curl manifest.json\n' -m 20 "$B/fixtures-phase9/manifest.json?v=1" || true
